name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated runtime and installation tests
        run: python3 scripts/verify.py
      - name: Build desktop widget
        run: python3 widget/build.py --output "$RUNNER_TEMP/ResourceDashboard.app"
      - name: Read-only widget smoke test
        run: '"$RUNNER_TEMP/ResourceDashboard.app/Contents/MacOS/ResourceDashboard" --self-test'
      - name: App icon is packed
        run: test -s "$RUNNER_TEMP/ResourceDashboard.app/Contents/Resources/AppIcon.icns"
